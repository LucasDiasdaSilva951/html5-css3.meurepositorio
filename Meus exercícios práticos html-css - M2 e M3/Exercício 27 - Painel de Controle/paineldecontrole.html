<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        #titulo:hover {
            color: rgb(107, 104, 56);
            font-size: 2.5em;
            font-weight: 600;
        }
        #botao1:hover {
            color: green;
            font-size: 1.5em;
            font-weight: 700;
        }
        #botao2:hover {
            color: red;
            font-size: 1.5em;
            font-weight: 700;
        }
        #botao3:hover {
            color: blue;
            font-size: 1.5em;
            font-weight: 700;
        }
        #botao4:hover {
            color: rgb(26, 26, 26);
            font-size: 1.5em;
            font-weight: 700;
        }
        #segredo {
            font-weight: 700;
            font-size: 1.5em;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            font-size: 1.35em;
            font-weight: 700;
            color: rgb(0, 0, 68);
        }
        div:hover {
            color:rgb(190, 44, 44);
            font-size: 1.5em;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Painel de Controle</h1>
    <p id="botao1">Iniciar Sistema</p>
    <p id="botao2">Desligar Sistema</p>
    <p id="botao3">Abrir Arquivos</p>
    <p id="botao4">Cancelar</p>
    <p id="segredo">Segredo escondido de Star Wars aqui embaixo... Clique para ver logo abaixo.    
    </p>
    <div>
        Segredo de Star Wars
        <p>Anakin Skywalker e Darth Vader são a mesma pessoa.</p>
    </div>
</body>
</html>
