<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <form action="cadastro.php" method="post">
        <label for="in1">Número 1: </label>
        <input type="number" name="n1" id="in1" required>
        
        <br>
        <br>

        <label for="in2">Número 2: </label>
        <input type="number" name="n2" id="in2" required>

        <br>
        <br>

        <input type="button" value="Somar" onclick="resultado.innerHTML = Number(in1.value) + Number(in2.value); resultado.style.display = 'inline'">
        <input type="reset" value="Limpar">

        <br>
        <br>

        <label for="">Resultado: </label><output id="resultado"></output>
    </form>
</body>
</html>
