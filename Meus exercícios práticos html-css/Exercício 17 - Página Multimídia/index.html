<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página para Treinar Mídias</title>
    <link rel="shortcut icon" href="favicon/favicon-16x16.png" type="image/png">
</head>
<body>
    <h1>Treinando Mídias</h1>

    <h2>Imagens Dinâmicas</h2>
    <p>Abaixo, terá uma imagem dinâmica aplicada nessa página.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/IMAGEMPEQUENA1.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/IMAGEMMEDIA1.png" type="image/png"> 
        <img src="imagens/IMAGEMGRANDE.png" alt="Imagem Grande">
    </picture>
    <h2>Áudios</h2>
    <p>Abaixo você ouvirá um áudio de uma música chamada Wide Boys, que é totalmente gratuita.</p>
    <audio controls preload="metadata">
        <source src="audio/Wide Boys - Underbelly & Ty Mayer.mp3" type="audio/mpeg">
    </audio>
    <h2>Vídeo</h2>
    <p>Abaixo terá um vídeo gratuito para ser visto.</p>
    <video width="560" height="315" muted autoplay loop>     
        <source src="videos/video1.mp4" type="video/mp4">        
        <source src="videos/video2.webm" type="video/webm">
        <source src="videos/video4.ogv" type="video/ogg">
        <p>O seu navegador não suporta reprodução de vídeos.</p>
    </video>
</body>
</html>
